name: Publish to npm

# 打 v* tag 即发布。首次发布必须先用令牌手动发一次(npm 要求包已存在才能配置 Trusted Publisher)。
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC 令牌 —— Trusted Publishing 的关键,缺了发不了
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 自带 npm >= 11.5.1,原生支持 Trusted Publishing 与 provenance。
          # 不要 `npm install -g npm@latest` —— 全局升级会漏装 sigstore,provenance 生成时报 MODULE_NOT_FOUND。
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      - run: npm publish # access=public 已在 package.json 的 publishConfig;build 由 prepublishOnly 触发
